<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNOL RADAR</title>
<meta name="theme-color" content="#17212d">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/dash.css">
<link rel="modulepreload" href="/agent.js">
<link rel="modulepreload" href="/model.js">
<link rel="modulepreload" href="/agent-i18n.js">
</head>
<body class="dk">
<div class="dk-shell">
  <aside class="dk-side" aria-label="CNOL RADAR menu">
    <div class="dk-brand">
      <a href="#home"><span class="dk-logo"><img src="/logo.png" alt="" width="30" height="26"></span><span><b>CNOL RADAR</b><small data-a="brandSub"></small></span></a>
      <a class="dk-bell" href="#alerts" id="bell"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dk-badge" id="bellN" hidden></span></a>
    </div>
    <nav id="nav" style="display:contents"></nav>
    <div class="dk-acct" id="acct"></div>
  </aside>
  <main class="dk-main" id="main" tabindex="-1">
    <div class="dk-top">
      <span class="dk-crumb" id="crumb"></span>
      <div class="dk-kind" role="group" id="kindSeg"></div>
      <button type="button" class="dk-hbtn ghost" id="refreshAll" style="height:40px;padding:0 16px;font-size:13.5px"></button>
      <div class="dk-lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko">KOR</button><button type="button" data-lang="en">ENG</button><button type="button" data-lang="ja">日本語</button>
      </div>
    </div>
    <div id="view" style="display:flex;flex-direction:column;gap:20px"></div>
    <p class="dk-derived" id="derived"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span></span></p>
  </main>
</div>
<div class="dk-snack" id="snack" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
