<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · CNOL RADAR</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17212d">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="au">
  <aside class="au-side">
    <a class="brand" href="/"><span><img src="/logo.png" alt="" width="24" height="21"></span><b>CNOL RADAR</b></a>
    <div>
      <h2 data-l="sideH"></h2>
      <p data-l="sideP"></p>
      <ul class="au-pts">
        <li><i aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></i><span><b data-l="pt1h"></b><span data-l="pt1"></span></span></li>
        <li><i aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg></i><span><b data-l="pt2h"></b><span data-l="pt2"></span></span></li>
        <li><i aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></i><span><b data-l="pt3h"></b><span data-l="pt3"></span></span></li>
      </ul>
    </div>
    <small data-l="fine"></small>
  </aside>
  <div class="au-main">
    <header class="au-bar">
      <a class="brand" href="/"><span><img src="/logo.png" alt="" width="24" height="21"></span><b>CNOL RADAR</b></a>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="ko">KO</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">日本語</button></div>
    </header>
    <main id="main">
      <!-- 둘러보기 모드 (개발 중 · 서버가 열어 둔 동안만 보여요) -->
      <section class="card soft pv" id="previewCard" aria-labelledby="pvh" hidden>
        <h2 id="pvh" data-l="pvT"></h2>
        <p class="note" style="font-size:13.5px;color:var(--ink2)" data-l="pvD"></p>
        <a class="btn" href="/app#home" id="pvBtn"><span data-l="pvBtn"></span></a>
      </section>
      <!-- 로그인 -->
      <section class="card" id="loginCard" aria-labelledby="lh">
        <div>
          <span class="badge" data-l="badge"></span>
          <h1 id="lh" data-l="title" style="margin-top:10px"></h1>
          <p class="sub" data-l="sub"></p>
        </div>
        <form id="loginForm" novalidate>
          <div class="field"><label for="uid" data-l="id"></label><div class="inp"><input id="uid" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div></div>
          <div class="field"><label for="pw" data-l="pw"></label><div class="inp pw"><input id="pw" name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" data-eye="pw"></button></div></div>
          <p class="msg" id="loginMsg" role="alert"></p>
          <button class="btn" type="submit" id="loginBtn"><span data-l="login"></span></button>
        </form>
        <p class="note"><a href="#forgot" id="forgotLink" data-l="forgot"></a></p>
        <p class="msg warn" id="forgotMsg" data-l="forgotP" hidden></p>
      </section>

      <!-- 1회용 관리자 계정 만들기 -->
      <section class="card" id="setupCard" aria-labelledby="sh" hidden>
        <div>
          <span class="badge" data-l="sBadge"></span>
          <h1 id="sh" data-l="sTitle" style="margin-top:10px"></h1>
          <p class="sub" data-l="sSub"></p>
        </div>
        <form id="setupForm" novalidate>
          <div class="field"><label for="sid" data-l="id"></label><div class="inp"><input id="sid" name="username" autocomplete="username" value="hrcompany" readonly></div></div>
          <div class="field"><label for="np" data-l="newPw"></label><div class="inp pw"><input id="np" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><button type="button" class="eye" data-eye="np"></button></div></div>
          <div class="field"><label for="np2" data-l="newPw2"></label><div class="inp pw"><input id="np2" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><button type="button" class="eye" data-eye="np2"></button></div></div>
          <ul class="checks" aria-live="polite"><li id="ck1"><i>✓</i><span data-l="ck1"></span></li><li id="ck2"><i>✓</i><span data-l="ck2"></span></li><li id="ck3"><i>✓</i><span data-l="ck3"></span></li></ul>
          <p class="msg" id="setupMsg" role="alert"></p>
          <button class="btn" type="submit" id="setupBtn" disabled><span data-l="sBtn"></span></button>
          <p class="note" data-l="sNote"></p>
        </form>
      </section>

      <!-- 처음이신가요: 초대 링크 · 사용 신청 -->
      <section class="card soft" id="startCard" aria-labelledby="nh">
        <h2 id="nh" data-l="startT"></h2>
        <p class="note" style="font-size:13.5px;color:var(--ink2)" data-l="startD"></p>
        <form id="startForm" novalidate>
          <div class="row"><div class="inp"><input id="startMail" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" maxlength="200" aria-label="Email"></div></div>
          <div class="row"><div class="inp"><input id="startOrg" autocomplete="organization" maxlength="80" data-l-ph="orgPh" aria-label="Company"></div><button class="btn line" type="submit" id="startBtn"><span data-l="startBtn"></span></button></div>
          <input type="text" id="startHp" tabindex="-1" autocomplete="off" hidden aria-hidden="true">
          <p class="msg" id="startMsg" role="status"></p>
        </form>
      </section>
      <nav class="foot" aria-label="links"><a href="/" data-l="home"></a><a href="/terms" data-l="terms"></a><a href="/privacy" data-l="privacy"></a><a href="mailto:support@whrcompany.com">support@whrcompany.com</a></nav>
    </main>
  </div>
</div>
<script type="module" src="/login.js"></script>
</body>
</html>
