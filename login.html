<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · CNOL RADAR</title>
<meta name="theme-color" content="#6200EE">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
body{background:var(--bg)}
.box{max-width:480px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-direction:column;gap:24px}
.panel{background:#fff;border-radius:12px;box-shadow:var(--e2);padding:32px;display:flex;flex-direction:column;gap:18px}
.social{min-height:52px;border-radius:6px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
.k{border:0;background:#FEE500;color:#191919}
.n{border:1.5px solid #03C75A;background:#fff;color:var(--ink)}
.g{border:1px solid var(--line-2);background:#fff;color:var(--ink)}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-size:13px}
.or::before,.or::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
</style>
</head>
<body>
<header style="background:#fff;box-shadow:var(--e1)">
  <div class="wrap" style="min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a class="brand" href="/"><img src="/logo.png" alt="" width="34" height="29"><span class="word"><b>CNOL</b> RADAR</span></a>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="ko">KO</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">日本語</button>
    </div>
  </div>
</header>
<main class="box">
  <section class="panel fu" aria-labelledby="h">
    <div class="stack" style="gap:8px">
      <h1 id="h" style="margin:0;font-size:30px;font-weight:900;letter-spacing:-.6px" data-l="title"></h1>
      <p style="margin:0;font-size:15px;line-height:1.7;color:var(--ink-2)" data-l="sub"></p>
    </div>
    <div class="stack" style="gap:10px">
      <button type="button" class="social k rip" id="kakao"><svg width="20" height="20" viewBox="0 0 24 24" fill="#191919" aria-hidden="true"><path d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 5.9L6.5 20l3.6-2.4c.6.1 1.2.1 1.9.1 5 0 9-3.1 9-7s-4-6.7-9-6.7z"/></svg><span data-l="kakao"></span></button>
      <button type="button" class="social n rip" id="naver"><span style="width:20px;height:20px;border-radius:4px;background:#03C75A" aria-hidden="true"></span><span data-l="naver"></span></button>
      <button type="button" class="social g rip" id="google"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1B20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-l="google"></span></button>
    </div>
    <div class="or" data-l="or"></div>
    <form id="mailForm" class="stack" style="gap:10px">
      <div class="field"><label for="email" data-l="email"></label><input class="input" id="email" type="email" autocomplete="email" required placeholder="name@example.com"></div>
      <button class="btn rip" type="submit" data-l="send"></button>
    </form>
    <p id="sent" role="status" style="margin:0;font-size:14px;line-height:1.6;color:var(--up)" hidden></p>
    <p style="margin:0;font-size:13px;line-height:1.7;color:var(--ink-2)"><span data-l="agree"></span> <a href="/terms" data-l="terms"></a> · <a href="/privacy" data-l="privacy"></a> · <a href="https://www.youtube.com/t/terms" rel="noopener">YouTube ToS</a> · <a href="https://policies.google.com/privacy" rel="noopener">Google Privacy</a></p>
  </section>
  <p style="margin:0;font-size:14px;line-height:1.7;color:var(--ink-2)" data-l="note"></p>
</main>
<script type="module" src="/login.js"></script>
</body>
</html>
